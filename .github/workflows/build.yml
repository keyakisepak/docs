name: Build GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
      - name: Verify rendered homepage and assets
        run: |
          test -s _site/index.html
          test -s _site/assets/css/main.css
          test -s _site/assets/images/hero.svg
          grep -q 'class="splash"' _site/index.html
          grep -q '欅セパタクロークラブ' _site/index.html
          grep -Eq '/docs/assets/css/main\.css\?v=[0-9]+' _site/index.html
          grep -q 'club-hero__logo' _site/assets/css/main.css
          grep -q '/docs/assets/images/hero.svg' _site/index.html
          test ! -e _site/README.html
          test ! -e _site/Gemfile
          test ! -e _site/docs
          test ! -e _site/AGENTS.html
          test ! -e _site/AGENTS.md
